<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form </title>
</head>
<body>
        <center>
            <table border="1px">
                <thead>
                    <th colspan="2">Registration Form</th>
                </thead>
                <tbody>
                    <tr>
                        <td>Student Name: </td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>Father's Name: </td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>Mother's Name: </td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>Date of Birth: </td>
                        <td><input type="date"></td>
                    </tr>
                    <tr>
                        <td>Gender: </td>
                        <td><input type="radio" name="Gender" value="Male"><label>Male</label>
                            <input type="radio" name="Gender" value="Female"Female><label>Female</label></td>
                    </tr>
                    <tr>
                        <td>Email ID: </td>
                        <td><input type="email"></td>
                    </tr>
                    <tr>
                        <td>Mobile No: </td>
                        <td><input type="number" min="11"></td>
                    </tr>
                    <tr>
                        <td>Address: </td>
                        <td><textarea name="" id="" cols="30" rows="4"></textarea></td>
                    </tr>
                    <tr>
                        <td>State: </td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td>City: </td>
                        <td><input type="text"></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td><input type="submit"></td>
                    </tr>

                </tbody>
            </table>
        </center>
</body>
</html>
