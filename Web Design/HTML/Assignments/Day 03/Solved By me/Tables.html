<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
</head>
<body>
    <center><h1>Tables</h1></center>
    <center><table border="2px" width = "50%" height = "200%">
        <tr>
            <th>Column 1</th>
            <th>Column 2</th>
            <th>Column 3</th>
        </tr>
        <tr>
            <th rowspan="2">Row 1 Cell 1</th>
            <th>Row 1 Cell 2</th>
            <th>Row 1 Cell 3</th>
        </tr>
        <tr>
            <th>Row 2 Cell 2</th>
            <th>Row 2 Cell 3</th>
        </tr>
        <tr>
            <th colspan="3">Row 3 Cell 1</th>
        </tr>
    </table></center>
</body>
</html>
